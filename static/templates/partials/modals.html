<!-- File Preview Modal -->
<div id="previewModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="previewModalTitle">
  <div class="modal-card preview-card">
    <div class="modal-header">
      <h3 id="previewModalTitle" class="preview-title">
        <svg class="icon heading-icon" aria-hidden="true"><use href="#i-files" /></svg>
        <span id="previewFileName">File Preview</span>
      </h3>
      <div class="preview-header-actions">
        <a id="previewDownloadBtn" href="#" class="btn-xs accent" download>
          <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
          Download
        </a>
        <button id="closePreviewBtn" class="btn-xs outline" aria-label="Close Preview">
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
    </div>
    <div id="previewContent" class="preview-content">
      <!-- Dynamic preview content: image, audio, video, pdf, or text -->
    </div>
  </div>
</div>

<!-- Host PC Drive & Folder Picker Modal (Works from both Phone & PC!) -->
<div id="hostModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="hostModalTitle">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="hostModalTitle">
        <svg class="icon heading-icon" aria-hidden="true"><use href="#i-folder-open" /></svg>
        Select a drive or folder
      </h3>
      <button id="closeModalBtn" class="btn-xs outline" aria-label="Close">
        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </div>
    <div class="drives-bar" id="drivesBar"></div>
    <div class="modal-path" id="modalCurrentPath">C:\</div>
    <ul class="modal-folder-list" id="modalFolderList"></ul>
    <div class="modal-footer">
      <button id="selectThisHostFolderBtn" class="btn primary" style="width: 100%">
        <svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>
        Share and open this folder
      </button>
    </div>
  </div>
</div>

<dialog
  id="actionDialog"
  class="action-dialog"
  aria-labelledby="actionDialogTitle"
  aria-describedby="actionDialogMessage"
>
  <form method="dialog" class="action-dialog-card">
    <h2 id="actionDialogTitle"></h2>
    <p id="actionDialogMessage"></p>
    <label id="actionDialogInputWrap" class="action-dialog-input-wrap hidden">
      <span id="actionDialogInputLabel"></span>
      <input id="actionDialogInput" type="text" autocomplete="off" maxlength="80" />
    </label>
    <div id="actionDialogActions" class="action-dialog-actions"></div>
  </form>
</dialog>

<!-- Floating Multi-Select Action Bar -->
<div id="selectionActionBar" class="selection-bar hidden">
  <div class="selection-bar-info">
    <strong id="barSelectedCount">0 selected</strong>
    <span id="barSelectedSize"></span>
  </div>
  <div class="selection-bar-buttons">
    <button id="downloadSelectedBtn" class="btn-sm success">
      <svg class="icon" aria-hidden="true"><use href="#i-archive" /></svg>
      Download selected (.zip)
    </button>
    <button id="deleteSelectedBtn" class="btn-sm danger">
      <svg class="icon" aria-hidden="true"><use href="#i-trash" /></svg>
      Delete
    </button>
    <button id="clearSelectionBtn" class="btn-sm outline">
      <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      Clear
    </button>
  </div>
</div>
