[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort, W = pycodestyle warnings
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["backend"]

